[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-l-simulator"
version = "0.1.0"
description = "A fault-aware simulator for distributed computing cells and resilient networks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["networkx>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
nexus-l = "nexus_l.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["nexus_l"]
